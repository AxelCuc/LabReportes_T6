services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - app-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nextjs_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres_db:5432/tienda
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
